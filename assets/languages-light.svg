<svg xmlns="http://www.w3.org/2000/svg" id="languages-light" viewBox="0 0 600 414" width="600" height="414" role="img" aria-label="Languages by number of repos: Python 192, HTML 164, JavaScript 151, CSS 136, Shell 64, Swift 34, TypeScript 28, PowerShell 14, Rust 9. Also C, C++, Go, GDScript, TeX." font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
