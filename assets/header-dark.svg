<title>Joona Tyrninoksa. building things to understand them. human curiosity × machine intelligence</title>
<defs><linearGradient id="header-dark-g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ff8fc2"/><stop offset="1" stop-color="#c79bff"/></linearGradient></defs>
<style>
#header-dark .cover { animation: header-dark-type 12s steps(35) infinite; }
#header-dark .cur { animation: header-dark-cur 12s steps(35) infinite, header-dark-blink 1s steps(1) infinite; }
#header-dark .sub { animation: header-dark-in 12s ease-out infinite; }
#header-dark .tw { animation: header-dark-tw 3.2s ease-in-out infinite; }
#header-dark .orbit { animation: header-dark-spin 14s linear infinite; }
#header-dark .pulse { animation: header-dark-pulse 3.2s ease-in-out infinite; }
@keyframes header-dark-type { 0% { transform: scaleX(1); } 25%, 100% { transform: scaleX(0); } }
@keyframes header-dark-cur { 0% { transform: translateX(-357.0px); } 25%, 100% { transform: translateX(0); } }
@keyframes header-dark-blink { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes header-dark-in { 0%, 26% { opacity: 0; } 34%, 100% { opacity: 1; } }
@keyframes header-dark-tw { 0%, 100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
@keyframes header-dark-spin { to { transform: rotate(360deg); } }
@keyframes header-dark-pulse { 0%, 100% { transform: scale(.92); } 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { #header-dark * { animation: none !important; } }
</style>
